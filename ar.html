<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Mode AR | AR Museum Geoteknologi</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="js/koleksi.js"></script>
  <script src="js/geologi3d.js"></script>
  <script src="js/komponen.js"></script>
</head>
<body class="halaman-3d" data-mode="ar">

  <div id="wadah-scene"></div>

  <div class="ui atas">
    <a class="kembali" href="index.html" aria-label="Kembali">&#8592;</a>
    <div id="pilih"></div>
  </div>

  <div class="ui" id="memuat">Menyiapkan model 3D...</div>
  <div class="ui" id="petunjuk">Arahkan kamera ke gambar marker</div>

  <section class="ui" id="panel">
    <div id="kategori"></div>
    <h1 id="nama"></h1>
    <p id="ringkas"></p>
    <div id="detail"></div>
    <div class="bagian-dalam">
      <h3>Isi bagian dalam</h3>
      <ul id="daftar-dalam"></ul>
    </div>
  </section>

  <div class="ui bawah">
    <button id="btn-belah" type="button">Belah batu</button>
    <button id="btn-suara" type="button" aria-label="Dengarkan penjelasan">&#128266;</button>
    <button id="btn-info" type="button" aria-label="Tampilkan/sembunyikan info">i</button>
  </div>

  <script>
    /* =================== PENGATURAN MARKER ===================
     * Sekarang : 1 marker contoh MindAR, koleksi dipilih lewat tombol di atas.
     * Nanti    : buat 5 marker sendiri, compile jadi assets/markers/targets.mind,
     *            isi targetIndex tiap koleksi di js/koleksi.js (0..4), lalu ubah:
     *              file: 'assets/markers/targets.mind', banyak: true
     */
    var MARKER = {
      file: 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind',
      banyak: false
    };
    // 'tegak' = marker berdiri (dinding, layar laptop) | 'meja' = marker diletakkan mendatar di meja
    var ORIENTASI = 'tegak';
    var SKALA_MODEL = 0.8;   // ukuran model dibanding lebar marker
    /* ========================================================= */

    (function () {
      var param = new URLSearchParams(location.search);
      var idAwal = param.get('id') || window.KOLEKSI[0].id;
      var target = MARKER.banyak
        ? window.KOLEKSI.map(function (k) { return { idx: k.targetIndex, id: k.id }; })
        : [{ idx: 0, id: idAwal }];
      var putarX = ORIENTASI === 'meja' ? '90 0 0' : '0 0 0';
      var isi = target.map(function (t) {
        return '<a-entity mindar-image-target="targetIndex: ' + t.idx + '">' +
                 '<a-entity position="0 0 0.3" rotation="' + putarX + '">' +
                   '<a-entity putar-geser="miring: false">' +
                     '<a-entity koleksi-3d="id: ' + t.id + '; skala: ' + SKALA_MODEL + '; tunda: ' + MARKER.banyak + '"></a-entity>' +
                   '</a-entity>' +
                 '</a-entity>' +
               '</a-entity>';
      }).join('');
      document.getElementById('wadah-scene').innerHTML =
        '<a-scene mindar-image="imageTargetSrc: ' + MARKER.file + '; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"' +
        ' color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"' +
        ' vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">' +
          '<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
          '<a-entity light="type: hemisphere; color: #fff6e8; groundColor: #4a4036; intensity: 2.6" data-lampu="2.6"></a-entity>' +
          '<a-entity light="type: directional; color: #fff; intensity: 3" position="1 2 3" data-lampu="3"></a-entity>' +
          isi +
        '</a-scene>';
    })();
  </script>
  <script src="js/ui.js"></script>
</body>
</html>
