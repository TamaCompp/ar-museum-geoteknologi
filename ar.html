<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test AR - Museum Geoteknologi UPN Veteran Yogyakarta</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #petunjuk {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px 14px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            font: 14px sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="petunjuk">Arahkan kamera ke marker untuk melihat model 3D</div>
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="model" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target0" mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#model" position="0 0 0.1" scale="0.005 0.005 0.005" animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true"></a-gltf-model>
        </a-entity>
    </a-scene>
    <script>
        const target = document.querySelector("#target0");
        const petunjuk = document.querySelector("#petunjuk");
        target.addEventListener("targetFound", () => { petunjuk.textContent = "Model 3D ditemukan!"; });
        target.addEventListener("targetLost", () => { petunjuk.textContent = "Arahkan kamera ke marker untuk melihat model 3D"; });
    </script>
</body>
</html>
